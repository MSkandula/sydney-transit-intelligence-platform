version: 2

sources:
  - name: bronze
    database: workspace
    schema: bronze
    description: >
      Landed by ingestion/land_bronze.py — read_files() for static GTFS files,
      COPY INTO for realtime trip updates and service alerts (incremental, tracks
      already-loaded files itself). Not managed by dbt.
    tables:
      - name: gtfs_static_routes
      - name: gtfs_static_stops
      - name: gtfs_static_trips
      - name: gtfs_static_stop_times
      - name: gtfs_static_calendar
      - name: gtfs_rt_trip_updates
        description: Polled every 15 min by the scheduled pipeline — see docs/scheduled_ingestion.md.
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: {count: 30, period: minute}
            error_after: {count: 90, period: minute}
      - name: gtfs_service_alerts
        description: Polled every 15 min by the scheduled pipeline — see docs/scheduled_ingestion.md.
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: {count: 30, period: minute}
            error_after: {count: 90, period: minute}
