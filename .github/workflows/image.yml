name: Build pipeline image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements*.txt
      - ingestion/**
      - dbt_transit/**
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mskandula/sydney-transit-pipeline:latest
            ghcr.io/mskandula/sydney-transit-pipeline:${{ github.sha }}
