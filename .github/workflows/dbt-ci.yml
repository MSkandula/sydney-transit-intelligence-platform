name: dbt CI

on:
  push:
    branches: [main]
    paths: ["dbt_transit/**"]
  pull_request:
    paths: ["dbt_transit/**"]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    # Builds into a dedicated `ci` schema on the same Databricks Free Edition SQL
    # warehouse the rest of this project uses — see profiles.yml.example. Dev and
    # CI intentionally share the one warehouse Free Edition provides; they're
    # isolated by target schema, not by separate infrastructure.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r dbt_transit/requirements.txt

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cp dbt_transit/profiles.yml.example ~/.dbt/profiles.yml

      - name: dbt deps
        working-directory: dbt_transit
        run: dbt deps

      - name: dbt build (CI schema)
        working-directory: dbt_transit
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: dbt build --target ci
