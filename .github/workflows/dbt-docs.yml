name: Publish dbt docs

on:
  push:
    branches: [main]
    paths: ["dbt_transit/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r dbt_transit/requirements.txt

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cp dbt_transit/profiles.yml.example ~/.dbt/profiles.yml

      - name: dbt deps
        working-directory: dbt_transit
        run: dbt deps

      # Generates catalog.json (real column-level metadata) against the live dev
      # schema — the same warehouse this project already uses everywhere else, not
      # a new credential surface. This step only reads; it never modifies the
      # warehouse (dbt docs generate issues describe queries, not DDL/DML).
      - name: dbt docs generate
        working-directory: dbt_transit
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: dbt docs generate

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dbt_transit/target

      - id: deployment
        uses: actions/deploy-pages@v4
